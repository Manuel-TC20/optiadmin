<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Nómina</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .navbar-custom {
            background-color: #1f2d3d;
        }

        .navbar-custom .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .card-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .card-header-custom {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            border-radius: 12px 12px 0 0;
        }

        .btn-custom {
            background-color: #007bff;
            border: none;
        }

        .btn-custom:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-custom px-4">
        <a class="navbar-brand" href="/">Sistema Empresarial</a>
    </nav>

    <!-- CONTENIDO -->
    <div class="container mt-5">

        <div class="card card-custom">
            <div class="card-header card-header-custom">
                Calculadora de Nómina
            </div>

            <div class="card-body">

                <form action="/calcular" method="POST" class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Sueldo Diario</label>
                        <input type="number" step="0.01" name="sueldo_diario" class="form-control" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Días Trabajados</label>
                        <input type="number" name="dias_trabajados" class="form-control" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Número de Faltas</label>
                        <input type="number" name="faltas" class="form-control" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Otras Percepciones</label>
                        <input type="number" step="0.01" name="percepciones" class="form-control" value="0">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Otras Deducciones</label>
                        <input type="number" step="0.01" name="deducciones" class="form-control" value="0">
                    </div>

                    <div class="col-12 d-flex justify-content-between mt-4">
                        <a href="/" class="btn btn-secondary">← Regresar</a>
                        <button type="submit" class="btn btn-custom">
                            Generar Recibo PDF
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </div>

</body>
</html>
