<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Aspirantes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .navbar-custom {
            background-color: #1f2d3d;
        }

        .navbar-custom .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .card-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .card-header-custom {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            border-radius: 12px 12px 0 0;
        }

        .btn-custom {
            background-color: #007bff;
            border: none;
        }

        .btn-custom:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-custom px-4">
    <a class="navbar-brand" href="/">Sistema Empresarial</a>
</nav>

<div class="container mt-5">

    <div class="card card-custom mx-auto" style="max-width: 650px;">
        
        <div class="card-header card-header-custom">
            Registro de Aspirantes
        </div>

        <div class="card-body">

            <form action="/registrar" method="POST" enctype="multipart/form-data">

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Apellido Paterno</label>
                        <input type="text" name="apellido_p" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Apellido Materno</label>
                        <input type="text" name="apellido_m" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" name="correo" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Número Telefónico</label>
                    <input type="text" name="numero" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Adjuntar CV (PDF)</label>
                    <input type="file" name="documento" class="form-control" accept=".pdf" required>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/" class="btn btn-secondary">← Regresar</a>
                    <button type="submit" class="btn btn-custom">
                        Registrar Aspirante
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
