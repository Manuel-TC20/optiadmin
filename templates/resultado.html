<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado del Examen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .navbar-custom {
            background-color: #1f2d3d;
        }

        .navbar-custom .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .card-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .card-header-custom {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            border-radius: 12px 12px 0 0;
        }

        .score-box {
            font-size: 28px;
            font-weight: bold;
            color: #007bff;
        }

        .message-box {
            font-size: 22px;
            margin-top: 10px;
        }

        .btn-custom {
            background-color: #007bff;
            border: none;
        }

        .btn-custom:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-custom px-4">
    <a class="navbar-brand" href="/">Sistema Empresarial</a>
</nav>

<div class="container mt-5">

    <div class="card card-custom text-center mx-auto" style="max-width: 600px;">
        <div class="card-header card-header-custom">
            Resultado del Examen Psicométrico
        </div>

        <div class="card-body">

            <p class="score-box">
                Puntaje total: {{ puntos }}
            </p>

            <p class="message-box">
                {{ mensaje }}
            </p>

            <div class="mt-4">
                <a href="/" class="btn btn-secondary">← Regresar al Panel</a>
                <a href="/examen" class="btn btn-custom">Repetir Examen</a>
            </div>

        </div>
    </div>

</div>

</body>
</html>
